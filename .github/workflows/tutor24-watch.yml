# Waechter fuer die tutor24-Automatik: ruft die Pruefung auf Vercel auf (app/api/tutor24/watch).
# Zuercher Pruefzeiten 9:45, 12:00, 15:00, 17:45, 20:00 (entscheidet die Seite selbst nach Zuercher Zeit und erinnert
# pro Pruefzeit hoechstens einmal). GitHub startet geplante Workflows oft verspaetet oder gar nicht (7.11.: kein
# einziger Lauf bis 13 Uhr) — deshalb alle 20 Minuten, nie zur vollen Stunde; ein Aufruf ohne faellige Pruefzeit
# tut nichts. 5-20 UTC deckt Winter und Sommer ab, auch fruehe eingestellte Zeiten (ab ca. 6:45 Pruefung). Oeffentliches Repo: Actions-Minuten kosten nichts.
# Noetig in GitHub: Secret WATCH_SECRET, Variable WATCH_URL (https://<app>/api/tutor24/watch).
name: tutor24-waechter

on:
  schedule:
    - cron: "7,27,47 5-20 * * *"
  workflow_dispatch: {}

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Pruefung auf Vercel aufrufen
        env:
          WATCH_SECRET: ${{ secrets.WATCH_SECRET }}
          WATCH_URL: ${{ vars.WATCH_URL }}
        run: |
          test -n "$WATCH_SECRET" && test -n "$WATCH_URL" || { echo "WATCH_SECRET oder WATCH_URL fehlt"; exit 1; }
          curl -fsS --retry 3 --retry-delay 20 -X POST -H "Authorization: Bearer $WATCH_SECRET" "$WATCH_URL"
